<!doctype html><html lang="pt-BR" translate="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Painel SDR — TriboTax</title>
<style>body{font:15px/1.5 -apple-system,system-ui,sans-serif;background:#14251D;color:#F6F1E8;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}div{text-align:center;max-width:420px;padding:24px}b{color:#E0A458}a{color:#E0A458}</style>
<body><div id="m"><b>Abrindo o painel…</b><br><small>localizando o endereço atual da ferramenta</small></div>
<script>
// O painel vive na API do Radar (endereço que muda). Esta página acha o endereço atual e redireciona.
(async()=>{
  const tok=(location.hash||'').replace('#','').trim();
  const m=document.getElementById('m');
  if(!tok){m.innerHTML='<b>Link incompleto.</b><br>Peça ao Matheus o link completo do painel (ele termina com #código).';return;}
  const fontes=[
    {u:'https://api.github.com/repos/gouveaero/tribotax.com.br/contents/radar-endpoint.json?ref=radar-endpoint',h:{Accept:'application/vnd.github.raw'}},
    {u:'https://raw.githubusercontent.com/gouveaero/tribotax.com.br/radar-endpoint/radar-endpoint.json',h:{}}];
  for(const f of fontes){
    try{const r=await fetch(f.u+(f.u.includes('?')?'&':'?')+'t='+Date.now(),{headers:f.h,cache:'no-store'});
        if(!r.ok)continue;const j=await r.json();if(!j.url)continue;
        const s=await fetch(j.url+'/saude',{cache:'no-store'}).then(x=>x.ok).catch(()=>false);
        if(s){location.replace(j.url+'/sdr/painel?t='+encodeURIComponent(tok));return;}
    }catch(e){}
  }
  m.innerHTML='<b>A ferramenta está fora do ar agora.</b><br>Tente de novo em alguns minutos — o computador do escritório precisa estar ligado.';
})();
</script></body></html>
