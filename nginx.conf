server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Evita vazar a porta interna (:3000) em redirects de diretório
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # HTML sempre revalida (etag → 304 barato). Sem isso o navegador usa cache
    # heurístico e visitantes recorrentes ficam presos no HTML antigo — que por
    # sua vez referencia os assets ?v= antigos, "segurando" qualquer deploy.
    add_header Cache-Control "no-cache";

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /manual-marca/ {
        try_files $uri $uri/ /manual-marca/index.html;
    }

    location /monitor-tributario/ {
        try_files $uri $uri/ /monitor-tributario/index.html;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
